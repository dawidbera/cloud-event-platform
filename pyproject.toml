[tool.poetry]
name = "cloud-event-platform"
version = "0.1.0"
description = "Cloud Event Processing Platform"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [
    { include = "kubeops" }
    { include = "shared" }
]

[tool.poetry.dependencies]
python = "^3.12"

fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.28.0"}
pydantic = {extras = ["settings"], version = "^2.6.0"}
pydantic-settings = "^2.2.1"
confluent-kafka = "^2.3.0"
sqlalchemy = "^2.0.28"
alembic = "^1.13.1"
psycopg2-binary = "^2.9.9"
redis = "^5.0.3"
kubernetes = "^29.0.0"
boto3 = "^1.34.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "^0.3.0"
mypy = "^1.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
